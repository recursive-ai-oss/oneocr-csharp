# Open font families used to render training and evaluation lines.
# `name` is the directory name in the Google Fonts repository at the pinned commit; `split` says whether the
# family may be used for training or only for held-out line evaluation. `oneocr-fonts build` turns this list
# into fonts.yaml (file URLs, SHA-256s, licence text hashes).
# The page evaluation set is rendered in other families (listed in `never`); they must not appear here.
repo: google/fonts
commit: e7db6ca603fd4862010383ff17ffd6cc4ffac1c0
max_files_per_family: 8
never: [gelasio, carlito, caladea, sourceserif4, sourcesans3, ibmplexserif, ibmplexsans]
families:
  train:
    # sans
    - opensans
    - notosans
    - firasans
    - ptsans
    - ubuntu
    - roboto
    - robotocondensed
