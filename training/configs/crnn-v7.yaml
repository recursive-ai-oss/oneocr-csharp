# Third fine-tune stage: continues from the best checkpoint of crnn-v6 with narrow-gap running text added (v6 dropped spaces between
# close words on screens), a lower learning rate and the same selection rule (validation sets only, relative to the starting model).
# ${ONEOCR_HOME} is the state directory of the machine running the job.
name: crnn-v7
seed: 7
init_from: ${ONEOCR_HOME}/runs/crnn-v6/best.pt
arch: crnn-v0
charset: data/charset-v1.txt
line_set: configs/lines-v4.yaml
data_dir: ${ONEOCR_PREV}/data/lines-v4
run_dir: ${ONEOCR_HOME}/runs/crnn-v7
sources:
  - { name: receipt-synth, kind: pack, dir: "${ONEOCR_HOME}/data/lines-v5/clean/train", line_set: configs/lines-v5.yaml, side: receipt, per_batch: 6, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gap-lines, kind: pack, dir: "${ONEOCR_HOME}/data/lines-v5/clean/gaps_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 10, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: ui-lines, kind: pack, dir: "${ONEOCR_HOME}/data/lines-v5/clean/ui_train", line_set: configs/lines-v5.yaml, side: ui, per_batch: 14, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: tight-lines, kind: pack, dir: "${ONEOCR_HOME}/data/lines-v5/clean/tight_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 14, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: cord-train, kind: crops, dir: "${ONEOCR_HOME}/data/cord-lines/train/finder", per_batch: 12, provenance: "CORD v2 train annotations, CC BY 4.0" }
extra_val:
  receipt_synth: ${ONEOCR_HOME}/data/lines-v5/val
  gaps: ${ONEOCR_HOME}/data/lines-v5/gaps_val
  ui: ${ONEOCR_HOME}/data/lines-v5/ui_val
  tight: ${ONEOCR_HOME}/data/lines-v5/tight_val
  cord_dev: ${ONEOCR_HOME}/data/cord-lines/val/finder
train:
  steps: 14000
  batch: 128
  lr: 0.0001
  warmup: 300
  weight_decay: 0.01
  log_every: 200
  eval_every: 2000
  ckpt_every: 2000
  val_penalty: 3.0
