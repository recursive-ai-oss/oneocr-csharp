# Masked card numbers and item-count prefixes of till receipts (`****1234`, `XXXX XXXX 1234`, `2x`, `2 @ 1.99`, `QTY 2`), alone and before item
# words. The reader turned runs of mask marks into rows of dots and glued or dropped the count marks, so these forms get their own
# exact-truth lines: families, books and degradation draws follow lines-r1 (training families for training, held-out families, books and
# the faint end for validation). Render with CFG=configs/lines-u89.yaml gen/make_lines_r1.sh OUT.
name: lines-u89
seed: 20268901
charset: data/charset-v1.txt
fonts: data/fonts.yaml
sets:
  mq_train: { n: 300000, fonts: train, books: train, degrade: rcpt, families: &rfam [courierprime, cutivemono, sharetechmono, anonymouspro, firamono, inconsolata, notosansmono, ptmono, sourcecodepro, spacemono, cousine, specialelite, robotocondensed, ubuntucondensed, oswald, arimo, roboto, notosans, opensans, inter, lato, ubuntu, ptsans, worksans], mix: &mq { mask: 0.5, qty: 0.5 }, single_script: true }
  mask_val: { n: 3000, fonts: heldout, books: heldout, degrade: rcpt, families: &hfam [jetbrainsmono, robotomono, ubuntumono, karla, cabin, alegreyasans, ptsansnarrow], mix: { mask: 1.0 }, single_script: true }
  qty_val: { n: 3000, fonts: heldout, books: heldout, degrade: rcpt, families: *hfam, mix: { qty: 1.0 }, single_script: true }
  mask_faint_val: { n: 2000, fonts: heldout, books: heldout, degrade: faint, families: *hfam, mix: { mask: 1.0 }, single_script: true }
  qty_faint_val: { n: 2000, fonts: heldout, books: heldout, degrade: faint, families: *hfam, mix: { qty: 1.0 }, single_script: true }
mix: *mq
gpu_degrade:
  # apparent crop heights of 16-65 px (CORD words), contrast over the whole range with 40% of the draws below 60 grey levels (floor 30),
  # thermal dropout and streaks on a third, a dot lattice on a quarter
  rcpt:
    ranges:
      em: [[8, 12], [10, 16], [14, 20], [18, 26], [24, 36]]
      blur_rel: [[0.02, 0.12], [0.06, 0.14]]
      motion: [1.5, 3.0]
      noise: [[0.0, 6.0], [2.0, 8.0]]
      shot: [0.0, 0.04]
      jpeg_q: [30, 90]
      contrast: [[30, 50], [32, 60], [40, 90], [55, 140], [55, 255]]
      persp: [0.0, 0.15]
      light: [0.0, 0.4]
      tilt_deg: [0.0, 0.3]
      dropout: [0.01, 0.05]
      streak: [0.02, 0.1]
      dots_per_em: [8.0, 13.0]
    p: { blur: 0.9, motion: 0.15, jpeg: 0.6, persp: 0.3, light: 0.4, subpixel: 0.05, dark: 0.04, tint: 0.3, sliver_v: 0.3, sliver_h: 0.2, rule: 0.2, resample: 0.6, resample2: 0.3, thermal: 0.33, dotmatrix: 0.3 }
  # held-out ranges: the faint end only (contrast 30-55), otherwise as rcpt
  faint:
    ranges:
      em: [[8, 12], [10, 16], [14, 20], [18, 26], [24, 36]]
      blur_rel: [[0.02, 0.12], [0.06, 0.14]]
      motion: [1.5, 3.0]
      noise: [[0.0, 5.0], [2.0, 6.0]]
      shot: [0.0, 0.04]
      jpeg_q: [30, 90]
      contrast: [[30, 55]]
      persp: [0.0, 0.15]
      light: [0.0, 0.4]
      tilt_deg: [0.0, 0.3]
      dropout: [0.01, 0.05]
      streak: [0.02, 0.1]
      dots_per_em: [8.0, 13.0]
    p: { blur: 0.9, motion: 0.15, jpeg: 0.6, persp: 0.3, light: 0.4, subpixel: 0.05, dark: 0.04, tint: 0.3, sliver_v: 0.3, sliver_h: 0.2, rule: 0.2, resample: 0.6, resample2: 0.3, thermal: 0.33, dotmatrix: 0.1 }
  # dot-matrix and impact print at moderate contrast; sizes where the dot pitch is at least 1.6 working pixels, so every line shows dots
  dots:
    ranges:
      em: [[16, 22], [20, 28], [24, 36]]
      blur_rel: [[0.02, 0.10]]
      motion: [1.5, 3.0]
      noise: [[0.0, 6.0]]
      shot: [0.0, 0.04]
      jpeg_q: [40, 90]
      contrast: [[45, 140], [60, 255]]
      persp: [0.0, 0.1]
      light: [0.0, 0.3]
      tilt_deg: [0.0, 0.3]
      dropout: [0.0, 0.02]
      streak: [0.0, 0.05]
      dots_per_em: [8.0, 13.0]
    p: { blur: 0.8, motion: 0.1, jpeg: 0.5, persp: 0.2, light: 0.3, subpixel: 0.0, dark: 0.0, tint: 0.3, sliver_v: 0.2, sliver_h: 0.1, rule: 0.2, resample: 0.6, resample2: 0.3, thermal: 0.2, dotmatrix: 1.0 }
