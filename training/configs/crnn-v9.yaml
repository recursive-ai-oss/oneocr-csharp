# Second stage of the targeted-error fine-tune. The first stage (crnn-v8) gained on figures and small text but lost the screenshot row, so
# this one starts again from the 0.5.0 checkpoint with the adaptive share halved, the interface-text and narrow-gap shares restored to
# their 0.5.0 sizes, a screenshot-style validation set in the selection score, and a hard guard: no checkpoint more than 2% worse than the
# starting model on production, interface, narrow-gap or screenshot-style validation can be selected. ${ONEOCR_HOME} is this stage's state
# directory, ${ONEOCR_PREV} the production run and ${ONEOCR_FT} the earlier fine-tune stage.
name: crnn-v9
seed: 9
init_from: ${ONEOCR_FT}/runs/crnn-v7/best.pt
arch: crnn-v0
charset: data/charset-v1.txt
line_set: configs/lines-v4.yaml
data_dir: ${ONEOCR_PREV}/data/lines-v4
run_dir: ${ONEOCR_HOME}/runs/crnn-v9
main_override:
  p: { resample: 0.5, resample2: 0.25 }
  ranges: { tilt_deg: [0.0, 0.3] }
sources:
  - name: adaptive
    kind: pack
    dir: ${ONEOCR_HOME}/data/lines-v6/clean/adapt_train
    line_set: configs/lines-v6.yaml
    side: adapt
    per_batch: 16
    provenance: exact-truth synthetic (configs/lines-v6.yaml)
    adaptive:
      stream_dir: ${ONEOCR_HOME}/data/lines-v6/clean/adapt_stream
      every: 3000
      gamma: 0.7
      clip: [0.4, 4.0]
      smooth: 0.5
      beta: 1.0
      bins:
        em: [6, 8, 10, 12, 14, 16, 21, 30, 60, 100]
        blur_rel: [0.0, 0.03, 0.06, 0.09, 0.125, 0.16]
        contrast: [45, 65, 90, 130, 180, 256]
        noise: [0, 2, 4, 6, 8, 12]
  - { name: receipt-synth, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/train", line_set: configs/lines-v5.yaml, side: receipt, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gap-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/gaps_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: ui-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/ui_train", line_set: configs/lines-v5.yaml, side: ui, per_batch: 14, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: tight-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/tight_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 14, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: cord-train, kind: crops, dir: "${ONEOCR_FT}/data/cord-lines/train/finder", per_batch: 12, provenance: "CORD v2 train annotations, CC BY 4.0" }
extra_val:
  receipt_synth: ${ONEOCR_FT}/data/lines-v5/val
  gaps: ${ONEOCR_FT}/data/lines-v5/gaps_val
  ui: ${ONEOCR_FT}/data/lines-v5/ui_val
  tight: ${ONEOCR_FT}/data/lines-v5/tight_val
  cord_dev: ${ONEOCR_FT}/data/cord-lines/val/finder
  figures: ${ONEOCR_HOME}/data/lines-v6/figures_val
  small: ${ONEOCR_HOME}/data/lines-v6/small_val
  reader: ${ONEOCR_HOME}/data/lines-v6/reader_val
  shot: ${ONEOCR_HOME}/data/lines-v6/shot_val
train:
  steps: 14000
  batch: 128
  lr: 0.00008
  warmup: 300
  weight_decay: 0.01
  log_every: 200
  eval_every: 2000
  ckpt_every: 2000
  val_penalty: 3.0
  guard: { val: 0.02, ui: 0.02, tight: 0.02, shot: 0.02 }
