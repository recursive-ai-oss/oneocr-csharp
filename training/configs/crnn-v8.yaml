# Targeted-error fine-tune of the production recognizer: starts from the best checkpoint of crnn-v7 (container 0.5.0). Every batch of 128:
# 52 lines of the lines-v4 production mix (degraded with the reader's resampling added), 32 lines drawn toward the model's own errors
# (train/adaptive.py: figures, receipt-style text, running text; weights re-measured every 3000 steps on a held-out stream), and the
# fine-tune sources of crnn-v7 (receipt-style, interface text, wide gaps, narrow gaps, real CORD crops). Selection is on the validation
# sets only (relative to the starting model). ${ONEOCR_HOME} is this stage's state directory, ${ONEOCR_PREV} the production run and
# ${ONEOCR_FT} the previous fine-tune stage.
name: crnn-v8
seed: 8
init_from: ${ONEOCR_FT}/runs/crnn-v7/best.pt
arch: crnn-v0
charset: data/charset-v1.txt
line_set: configs/lines-v4.yaml
data_dir: ${ONEOCR_PREV}/data/lines-v4
run_dir: ${ONEOCR_HOME}/runs/crnn-v8
main_override:
  p: { resample: 0.5, resample2: 0.25 }
  ranges: { tilt_deg: [0.0, 0.3] }
sources:
  - name: adaptive
    kind: pack
    dir: ${ONEOCR_HOME}/data/lines-v6/clean/adapt_train
    line_set: configs/lines-v6.yaml
    side: adapt
    per_batch: 32
    provenance: exact-truth synthetic (configs/lines-v6.yaml)
    adaptive:
      stream_dir: ${ONEOCR_HOME}/data/lines-v6/clean/adapt_stream
      every: 3000
      gamma: 0.7
      clip: [0.4, 4.0]
      smooth: 0.5
      beta: 1.0
      bins:
        em: [6, 8, 10, 12, 14, 16, 21, 30, 60, 100]
        blur_rel: [0.0, 0.03, 0.06, 0.09, 0.125, 0.16]
        contrast: [45, 65, 90, 130, 180, 256]
        noise: [0, 2, 4, 6, 8, 12]
  - { name: receipt-synth, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/train", line_set: configs/lines-v5.yaml, side: receipt, per_batch: 6, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gap-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/gaps_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 6, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: ui-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/ui_train", line_set: configs/lines-v5.yaml, side: ui, per_batch: 8, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: tight-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/tight_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 8, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: cord-train, kind: crops, dir: "${ONEOCR_FT}/data/cord-lines/train/finder", per_batch: 12, provenance: "CORD v2 train annotations, CC BY 4.0" }
extra_val:
  receipt_synth: ${ONEOCR_FT}/data/lines-v5/val
  gaps: ${ONEOCR_FT}/data/lines-v5/gaps_val
  ui: ${ONEOCR_FT}/data/lines-v5/ui_val
  tight: ${ONEOCR_FT}/data/lines-v5/tight_val
  cord_dev: ${ONEOCR_FT}/data/cord-lines/val/finder
  figures: ${ONEOCR_HOME}/data/lines-v6/figures_val
  small: ${ONEOCR_HOME}/data/lines-v6/small_val
  reader: ${ONEOCR_HOME}/data/lines-v6/reader_val
train:
  steps: 36000
  batch: 128
  lr: 0.00015
  warmup: 300
  weight_decay: 0.01
  log_every: 200
  eval_every: 2000
  ckpt_every: 2000
  val_penalty: 3.0
