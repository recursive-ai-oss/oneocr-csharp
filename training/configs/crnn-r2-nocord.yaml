# Receipt fine-tune on the lines the engine itself cuts from generated receipt photos: chains from ${ONEOCR_BASE} (the accepted
# checkpoint) and keeps the mix of its last stage (adaptive 12, receipt-style 4, wide gaps 4, interface 20, narrow gaps 20, CORD crops 12, the
# production mix fills the rest); on top it adds 16 lines per batch of transcribed engine crops (`gen/best_angle.py` picks each photo's reading angle from engine confidence alone, then `gen/receipt_photos.py align` and
# `LineGen --page-lines`: crops cut by the detector's own line boxes, tilted lines rectified, labelled with the transcription of the printed
# line). Selection on validation only, relative to the starting model: the sets of the last stage plus the engine crops of the held-out
# receipt photos. ${ONEOCR_HOME} is this stage's state directory, ${ONEOCR_PREV} the production run, ${ONEOCR_FT} the receipt fine-tune
# stage (CORD crops), ${ONEOCR_V6} the data of the targeted-error stage, ${ONEOCR_GEN} the engine crops (parts train, dev, calib).
# crnn-r2-nocord.yaml is the same without the CORD crops (the ablation: batch 132 = 144 minus the 12 CORD lines, the other shares unchanged).
name: crnn-r2-nocord
seed: 12
init_from: ${ONEOCR_BASE}
arch: crnn-v0
charset: data/charset-v1.txt
line_set: configs/lines-v4.yaml
data_dir: ${ONEOCR_PREV}/data/lines-v4
run_dir: ${ONEOCR_HOME}/runs/crnn-r2-nocord
main_override:
  p: { resample: 0.5, resample2: 0.25 }
  ranges: { tilt_deg: [0.0, 0.3] }
sources:
  - name: adaptive
    kind: pack
    dir: ${ONEOCR_V6}/data/lines-v6/clean/adapt_train
    line_set: configs/lines-v6.yaml
    side: adapt
    per_batch: 12
    provenance: exact-truth synthetic (configs/lines-v6.yaml)
    adaptive:
      stream_dir: ${ONEOCR_V6}/data/lines-v6/clean/adapt_stream
      every: 3000
      gamma: 0.7
      clip: [0.4, 4.0]
      smooth: 0.5
      beta: 1.0
      bins:
        em: [6, 8, 10, 12, 14, 16, 21, 30, 60, 100]
        blur_rel: [0.0, 0.03, 0.06, 0.09, 0.125, 0.16]
        contrast: [45, 65, 90, 130, 180, 256]
        noise: [0, 2, 4, 6, 8, 12]
  - { name: receipt-synth, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/train", line_set: configs/lines-v5.yaml, side: receipt, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gap-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/gaps_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: ui-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/ui_train", line_set: configs/lines-v5.yaml, side: ui, per_batch: 20, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: tight-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/tight_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 20, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gen-receipt-engine, kind: crops, dir: "${ONEOCR_GEN}/crops/train/finder", per_batch: 16, provenance: "receipt photos generated with Google Gemini 3.1 Flash Image, transcribed by Anthropic Claude Sonnet; engine line crops (gen/receipt_photos.py)" }
extra_val:
  receipt_synth: ${ONEOCR_FT}/data/lines-v5/val
  gaps: ${ONEOCR_FT}/data/lines-v5/gaps_val
  ui: ${ONEOCR_FT}/data/lines-v5/ui_val
  tight: ${ONEOCR_FT}/data/lines-v5/tight_val
  cord_dev: ${ONEOCR_FT}/data/cord-lines/val/finder
  gen_dev: ${ONEOCR_GEN}/crops/dev/finder
  figures: ${ONEOCR_V6}/data/lines-v6/figures_val
  small: ${ONEOCR_V6}/data/lines-v6/small_val
  reader: ${ONEOCR_V6}/data/lines-v6/reader_val
  shot: ${ONEOCR_V6}/data/lines-v6/shot_val
train:
  steps: 12000
  batch: 132
  lr: 0.00006
  warmup: 200
  weight_decay: 0.01
  log_every: 200
  eval_every: 2000
  ckpt_every: 2000
  val_penalty: 3.0
  guard: { val: 0.02, ui: 0.02, tight: 0.02, shot: 0.02 }
  guard_wer: { shot: 0.0, ui: 0.02, tight: 0.02 }
