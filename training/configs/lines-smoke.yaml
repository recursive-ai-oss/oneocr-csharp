# Smoke-scale line set for pipeline checks. Seeds and degradation ranges are part of the dataset definition.
name: lines-smoke
seed: 20261023
charset: data/charset-v1.txt
fonts: data/fonts.yaml
sets:
  train: { n: 40000, fonts: train, degrade: train }
  val: { n: 1000, fonts: train, degrade: train }      # monitoring only: training fonts, unseen texts
  eval: { n: 2000, fonts: heldout, degrade: heldout }  # held-out font families and held-out degradation ranges
degrade:
  # em: rendered font size in pixels before the crop is scaled to the model height (list of [lo, hi] ranges)
  # blur: Gaussian sigma in source pixels; noise: additive Gaussian sigma in gray levels
  # jpeg_*: probability and quality range of a JPEG round trip; contrast: ink/paper gray difference
  train:
    em: [[20, 64]]
    blur: [0.0, 0.8]
    noise: [0.0, 5.0]
    jpeg_prob: 0.3
    jpeg_q: [55, 95]
    contrast: [90, 230]
  heldout:
    em: [[16, 20], [64, 80]]
    blur: [0.8, 1.1]
    noise: [5.0, 7.0]
    jpeg_prob: 0.5
    jpeg_q: [35, 55]
    contrast: [70, 90]
