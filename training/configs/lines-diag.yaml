# Diagnostic sets for separating the two held-out factors (font family vs degradation range).
name: lines-diag
seed: 777
charset: data/charset-v1.txt
fonts: data/fonts.yaml
sets:
  diag_fonts: { n: 1000, fonts: heldout, degrade: train }     # unseen font families, training degradations
  diag_degrade: { n: 1000, fonts: train, degrade: heldout }   # training fonts, unseen degradation ranges
degrade:
  train:
    em: [[20, 64]]
    blur: [0.0, 0.8]
    noise: [0.0, 5.0]
    jpeg_prob: 0.3
    jpeg_q: [55, 95]
    contrast: [90, 230]
  heldout:
    em: [[16, 20], [64, 80]]
    blur: [0.8, 1.1]
    noise: [5.0, 7.0]
    jpeg_prob: 0.5
    jpeg_q: [35, 55]
    contrast: [70, 90]
