# Detector 0.2.1: continue dbnet-02 with page lines cut at wide word gaps (table cells, form columns), CORD v2 train receipts (dataset word quads, grouped into lines,
# supervised only inside the annotated rows) and more rotation on receipts for the orientation head.
name: dbnet-021
seed: 4
size: 1024
scale: [0.7, 1.15]
rot_p: 0.25
datasets_root: ${ONEOCR_DATASETS}
run_dir: ${ONEOCR_HOME}/runs/dbnet-021
init_from: ${ONEOCR_HOME}/runs/dbnet-02/best.pt
model: {orient16: true, layout16_blocks: 4, widths: [32, 72, 176, 288], depths: [2, 3, 6, 4], fpn: 48, text: 32, layout: 96, layout16: 160}
sources:
  - {name: doclaynet, weight: 0.4, label_source: "DocLayNet 1.0.0 layout boxes + extra-archive text cells (CDLA-Permissive-1.0)"}
  - {name: publaynet, weight: 0.15, label_source: "PubLayNet 1.0.0 layout boxes, CC0/CC BY articles only (annotations CDLA-Permissive-1.0)"}
  - {name: pages, weight: 0.25, dir: "${ONEOCR_PAGES}", cache: "${ONEOCR_HOME}/cache/pages-{split}.json", label_source: "exact-truth synthetic pages (browser layout geometry)"}
  - {name: cord, weight: 0.2, label_source: "CORD v2 train word quads (CC BY 4.0), grouped into lines; annotated rows only"}
loss: {prob: 1.0, binary: 1.0, thresh: 10.0, layout_bce: 1.0, layout_dice: 2.0, orient: 0.3}
train:
  steps: 20000
  batch: 12
  lr: 0.0007
  warmup: 200
  weight_decay: 0.0001
  workers: 20
  log_every: 200
  eval_every: 2500
  ckpt_every: 500
  val_pages: 150
  max_minutes: 100
