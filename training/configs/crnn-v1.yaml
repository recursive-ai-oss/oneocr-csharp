# First full recognizer run on the line set lines-v1. ${ONEOCR_HOME} is the persistent state directory of the machine running the job.
name: crnn-v1
seed: 1
charset: data/charset-v1.txt
data_dir: ${ONEOCR_HOME}/data/lines-v1
run_dir: ${ONEOCR_HOME}/runs/crnn-v1
train:
  steps: 70000
  batch: 128
  lr: 0.002
  warmup: 1000
  weight_decay: 0.01
  log_every: 200
  eval_every: 3000
  ckpt_every: 1000
