# Receipt-text fine-tune of the production recognizer: chains from ${ONEOCR_BASE} (the accepted checkpoint of the separator/interface stage)
# and keeps every source and per-batch share of that stage's mix unchanged (adaptive 12, receipt-style 4, wide gaps 4, interface 20, narrow
# gaps 20, CORD crops 12, the production mix fills the rest); on top it adds 24 lines per batch of lines-r1 (faint thermal and dot-matrix
# print, runs of zeros, round amounts in both separator conventions, counts, label words). Selection on validation only, relative to the
# starting model: the sets of that stage plus the CORD dev crops and three held-out receipt sets (all, faint, dot-matrix); the same
# character and word guards. ${ONEOCR_HOME} is this stage's state directory, ${ONEOCR_PREV} the production run, ${ONEOCR_FT} the receipt
# fine-tune stage, ${ONEOCR_V6} the data of the targeted-error stage.
name: crnn-r1
seed: 11
init_from: ${ONEOCR_BASE}
arch: crnn-v0
charset: data/charset-v1.txt
line_set: configs/lines-v4.yaml
data_dir: ${ONEOCR_PREV}/data/lines-v4
run_dir: ${ONEOCR_HOME}/runs/crnn-r1
main_override:
  p: { resample: 0.5, resample2: 0.25 }
  ranges: { tilt_deg: [0.0, 0.3] }
sources:
  - name: adaptive
    kind: pack
    dir: ${ONEOCR_V6}/data/lines-v6/clean/adapt_train
    line_set: configs/lines-v6.yaml
    side: adapt
    per_batch: 12
    provenance: exact-truth synthetic (configs/lines-v6.yaml)
    adaptive:
      stream_dir: ${ONEOCR_V6}/data/lines-v6/clean/adapt_stream
      every: 3000
      gamma: 0.7
      clip: [0.4, 4.0]
      smooth: 0.5
      beta: 1.0
      bins:
        em: [6, 8, 10, 12, 14, 16, 21, 30, 60, 100]
        blur_rel: [0.0, 0.03, 0.06, 0.09, 0.125, 0.16]
        contrast: [45, 65, 90, 130, 180, 256]
        noise: [0, 2, 4, 6, 8, 12]
  - { name: receipt-synth, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/train", line_set: configs/lines-v5.yaml, side: receipt, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: gap-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/gaps_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 4, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: ui-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/ui_train", line_set: configs/lines-v5.yaml, side: ui, per_batch: 20, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: tight-lines, kind: pack, dir: "${ONEOCR_FT}/data/lines-v5/clean/tight_train", line_set: configs/lines-v4.yaml, side: train, per_batch: 20, provenance: "exact-truth synthetic (configs/lines-v5.yaml)" }
  - { name: receipt-text, kind: pack, dir: "${ONEOCR_HOME}/data/lines-r1/clean/recv_train", line_set: configs/lines-r1.yaml, side: rcpt, per_batch: 24, provenance: "exact-truth synthetic (configs/lines-r1.yaml)" }
  - { name: cord-train, kind: crops, dir: "${ONEOCR_FT}/data/cord-lines/train/finder", per_batch: 12, provenance: "CORD v2 train annotations, CC BY 4.0" }
extra_val:
  receipt_synth: ${ONEOCR_FT}/data/lines-v5/val
  gaps: ${ONEOCR_FT}/data/lines-v5/gaps_val
  ui: ${ONEOCR_FT}/data/lines-v5/ui_val
  tight: ${ONEOCR_FT}/data/lines-v5/tight_val
  cord_dev: ${ONEOCR_FT}/data/cord-lines/val/finder
  recv: ${ONEOCR_HOME}/data/lines-r1/recv_val
  faint: ${ONEOCR_HOME}/data/lines-r1/faint_val
  dots: ${ONEOCR_HOME}/data/lines-r1/dots_val
  figures: ${ONEOCR_V6}/data/lines-v6/figures_val
  small: ${ONEOCR_V6}/data/lines-v6/small_val
  reader: ${ONEOCR_V6}/data/lines-v6/reader_val
  shot: ${ONEOCR_V6}/data/lines-v6/shot_val
train:
  steps: 16000
  batch: 152
  lr: 0.00006
  warmup: 200
  weight_decay: 0.01
  log_every: 200
  eval_every: 2000
  ckpt_every: 2000
  val_penalty: 3.0
  guard: { val: 0.02, ui: 0.02, tight: 0.02, shot: 0.02 }
  guard_wer: { shot: 0.0, ui: 0.02, tight: 0.02 }
