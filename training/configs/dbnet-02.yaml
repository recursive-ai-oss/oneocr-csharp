# Text-line detector + layout head, dbnet-lite 0.2.0. ${ONEOCR_HOME} is the state directory of the machine running the job.
name: dbnet-02
seed: 3
size: 1024
scale: [0.7, 1.15]
rot_p: 0.25
datasets_root: ${ONEOCR_DATASETS}
run_dir: ${ONEOCR_HOME}/runs/dbnet-02
model: {orient16: true, layout16_blocks: 4, widths: [32, 72, 176, 288], depths: [2, 3, 6, 4], fpn: 48, text: 32, layout: 96, layout16: 160}
sources:
  - {name: doclaynet, weight: 0.55, label_source: "DocLayNet 1.0.0 layout boxes + extra-archive text cells (CDLA-Permissive-1.0)"}
  - {name: publaynet, weight: 0.25, label_source: "PubLayNet 1.0.0 layout boxes, CC0/CC BY articles only (annotations CDLA-Permissive-1.0)"}
  - {name: pages, weight: 0.2, dir: "${ONEOCR_PAGES}", cache: "${ONEOCR_HOME}/cache/pages-{split}.json", label_source: "exact-truth synthetic pages (browser layout geometry)"}
loss: {prob: 1.0, binary: 1.0, thresh: 10.0, layout_bce: 1.0, layout_dice: 2.0, orient: 0.3}
train:
  steps: 100000
  batch: 12
  lr: 0.002
  warmup: 500
  weight_decay: 0.0001
  workers: 20
  log_every: 200
  eval_every: 4000
  ckpt_every: 500
  val_pages: 150
  max_minutes: 105
