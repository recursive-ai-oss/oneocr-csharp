# Short smoke training: shows the loss falling and greedy decoding starting to read held-out lines.
# ${ONEOCR_HOME} is the persistent state directory on the machine running the job.
name: crnn-smoke
seed: 1
charset: data/charset-v1.txt
data_dir: ${ONEOCR_HOME}/data/lines-smoke
run_dir: ${ONEOCR_HOME}/runs/crnn-smoke
train:
  steps: 6000
  batch: 128
  lr: 0.002
  warmup: 300
  weight_decay: 0.01
  log_every: 100
  eval_every: 1000
  ckpt_every: 500
