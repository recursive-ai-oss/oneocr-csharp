# Detector 0.3.1 fine-tune: continues the 0.3.0 weights with the web-window mix of dbnet-web.yaml, where windows carrying small light-on-dark text are drawn more often and a share of the web and dark-page windows has its text faded towards the local background (low contrast, labels unchanged). The candidate may be blended with its parent (export/blend_checkpoints.py); thresholds are selected on held-out sets only.
name: dbnet-faint
seed: 7
size: 1024
scale: [0.7, 1.15]
rot_p: 0.25
datasets_root: ${ONEOCR_DATASETS}
run_dir: ${ONEOCR_HOME}/runs/dbnet-faint
init_from: ${ONEOCR_BASE}
model: {orient16: true, layout16_blocks: 4, widths: [32, 72, 176, 288], depths: [2, 3, 6, 4], fpn: 48, text: 32, layout: 96, layout16: 160}
sources:
  - {name: doclaynet, weight: 0.25, label_source: "DocLayNet 1.0.0 layout boxes + extra-archive text cells (CDLA-Permissive-1.0)"}
  - {name: publaynet, weight: 0.08, label_source: "PubLayNet 1.0.0 layout boxes, CC0/CC BY articles only (annotations CDLA-Permissive-1.0)"}
  - {name: pages, weight: 0.17, dir: "${ONEOCR_PAGES}", cache: "${ONEOCR_HOME}/cache/pages-{split}.json", label_source: "exact-truth synthetic pages (browser layout geometry)"}
  - {name: pages_dark, weight: 0.12, faint_p: 0.35, dir: "${ONEOCR_PAGES_DARK}", cache: "${ONEOCR_HOME}/cache/pages-dark-{split}.json", label_source: "exact-truth synthetic light-on-dark pages (browser layout geometry)"}
  - {name: cord, weight: 0.10, label_source: "CORD v2 train word quads (CC BY 4.0), grouped into lines; annotated rows only"}
  - {name: web, weight: 0.28, dir: "${ONEOCR_WEB_WINDOWS}", dark_repeat: 5, faint_p: 0.35, rot_p: 0.1, val_publishers: [nrc],
     label_source: "DOM line boxes of public-domain US federal web pages rendered in Chromium (train sites only); unverified DOM lines ignored"}
loss: {prob: 1.0, binary: 1.0, thresh: 10.0, layout_bce: 1.0, layout_dice: 2.0, orient: 0.3}
train:
  steps: 10000
  batch: 12
  lr: 0.00015
  warmup: 200
  weight_decay: 0.0001
  workers: 20
  log_every: 200
  eval_every: 2000
  ckpt_every: 500
  val_pages: 150
  max_minutes: 75
