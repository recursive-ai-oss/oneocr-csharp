# Line set for the financial fine-tune of the recognizer: amounts, dates, account numbers, quantities and their signs and separators
# (gen/fin_text.py) on fax (1-bit, standard and fine), flatbed-scan, photocopy and phone captures, next to a smaller replay of the
# production mix so prose, receipts, interface text and tight crops keep their weight. All text is generated here and the rendered
# string is the label (exact truth); fonts are the training families of data/fonts.yaml only. Render with gen/make_lines_r1.sh:
#   CFG=configs/lines-fin.yaml gen/make_lines_r1.sh OUT_DIR            (plan + clean packs, then the validation sets on the GPU)
name: lines-fin
seed: 20269151
charset: data/charset-v1.txt
fonts: data/fonts.yaml
sets:
  # replay of the production mix (same text recipes and degradation sides as the earlier line sets, smaller)
  train: { n: 60000, fonts: train, books: train, degrade: train, degrade_from: configs/lines-v4.yaml }
  val: { n: 3000, fonts: train, books: heldout, degrade: train, degrade_from: configs/lines-v4.yaml }
  eval: { n: 5000, fonts: heldout, books: heldout, degrade: heldout, degrade_from: configs/lines-v4.yaml }
  rep_train: { n: 40000, fonts: train, books: train, degrade: adapt, degrade_from: configs/lines-v6.yaml, mix: { figures: 0.30, receipt: 0.12, numbers: 0.08, codes: 0.08, book: 0.25, pseudo: 0.05, rare: 0.04 } }
  figures_val: { n: 3000, fonts: train, books: heldout, degrade: adapt, degrade_from: configs/lines-v6.yaml, mix: { figures: 1.0 } }
  ui_train: { n: 30000, fonts: train, books: train, degrade: ui, degrade_from: configs/lines-v5.yaml, mix: { ui: 1.0 }, families: &ui [arimo, roboto, notosans, opensans, inter, lato, ubuntu, ptsans, worksans, manrope, firasans, rubik, jost, istokweb, notoserif, ptserif, cousine] }
  ui_val: { n: 3000, fonts: train, books: heldout, degrade: ui, degrade_from: configs/lines-v5.yaml, mix: { ui: 1.0 }, families: *ui }
  tight_train: { n: 20000, fonts: train, books: train, degrade: page, degrade_from: configs/lines-v5.yaml, mix: { tight: 1.0 } }
  tight_val: { n: 3000, fonts: train, books: heldout, degrade: page, degrade_from: configs/lines-v5.yaml, mix: { tight: 1.0 } }
  gaps_train: { n: 20000, fonts: train, books: train, degrade: page, degrade_from: configs/lines-v5.yaml, mix: { gap: 1.0 } }
  gaps_val: { n: 3000, fonts: train, books: heldout, degrade: page, degrade_from: configs/lines-v5.yaml, mix: { gap: 1.0 } }
  shot_val: { n: 3000, fonts: train, books: heldout, degrade: screen, degrade_from: configs/lines-v6.yaml, mix: { ui: 0.6, tight: 0.4 }, families: *ui }
  mq_train: { n: 20000, fonts: train, books: train, degrade: rcpt, degrade_from: configs/lines-masks.yaml, families: &rfam [courierprime, cutivemono, sharetechmono, anonymouspro, firamono, inconsolata, notosansmono, ptmono, sourcecodepro, spacemono, cousine, specialelite, robotocondensed, ubuntucondensed, oswald, arimo, roboto, notosans, opensans, inter, lato, ubuntu, ptsans, worksans], mix: { mask: 0.5, qty: 0.5 }, single_script: true }
  mask_val: { n: 2000, fonts: heldout, books: heldout, degrade: rcpt, degrade_from: configs/lines-masks.yaml, families: &hfam [jetbrainsmono, robotomono, ubuntumono, karla, cabin, alegreyasans, ptsansnarrow], mix: { mask: 1.0 }, single_script: true }
  qty_val: { n: 2000, fonts: heldout, books: heldout, degrade: rcpt, degrade_from: configs/lines-masks.yaml, families: *hfam, mix: { qty: 1.0 }, single_script: true }
  # financial strings (gen/fin_text.py); the training pack is clean, the four capture sides below degrade it at training time.
  # fin_val_*: training fonts and ranges, unseen books (used to select checkpoints). fin_eval_*: held-out font families and
  # degradation ranges (reported, never used to select). fin_calib: every font family, training and held-out sides alternating.
  fin_train: { n: 200000, fonts: train, books: train, families: &finfam [opensans, notosans, firasans, ptsans, ubuntu, roboto, robotocondensed, rubik, montserrat, worksans, exo2, manrope, jost, inter, istokweb, scada, play, arimo, ubuntucondensed, lato, ptserif, merriweather, lora, librebaskerville, crimsontext, bitter, alegreya, literata, notoserif, tinos, cardo, arvo, zillaslab, robotoslab, crimsonpro, ptmono, firamono, inconsolata, sourcecodepro, cousine, anonymouspro, courierprime, cutivemono, notosansmono, spacemono], degrade: fin_fax, mix: &finmix { fin: 0.80, book: 0.10, numbers: 0.04, codes: 0.02, figures: 0.04 } }
  fin_val_fax: { n: 2000, fonts: train, books: heldout, families: *finfam, degrade: fin_fax, mix: *finmix }
  fin_val_scan: { n: 2000, fonts: train, books: heldout, families: *finfam, degrade: fin_scan, mix: *finmix }
  fin_val_copy: { n: 2000, fonts: train, books: heldout, families: *finfam, degrade: fin_copy, mix: *finmix }
  fin_val_phone: { n: 2000, fonts: train, books: heldout, families: *finfam, degrade: fin_phone, mix: *finmix }
  fin_eval_fax: { n: 2000, fonts: heldout, books: heldout, families: [spectral, domine, cabin, karla, alegreyasans, ptsansnarrow, vollkorn, jetbrainsmono, robotomono, ubuntumono], degrade: fin_fax_h, mix: *finmix }
  fin_eval_scan: { n: 2000, fonts: heldout, books: heldout, families: [spectral, domine, cabin, karla, alegreyasans, ptsansnarrow, vollkorn, jetbrainsmono, robotomono, ubuntumono], degrade: fin_scan_h, mix: *finmix }
  fin_eval_copy: { n: 2000, fonts: heldout, books: heldout, families: [spectral, domine, cabin, karla, alegreyasans, ptsansnarrow, vollkorn, jetbrainsmono, robotomono, ubuntumono], degrade: fin_copy_h, mix: *finmix }
  fin_eval_phone: { n: 2000, fonts: heldout, books: heldout, families: [spectral, domine, cabin, karla, alegreyasans, ptsansnarrow, vollkorn, jetbrainsmono, robotomono, ubuntumono], degrade: fin_phone_h, mix: *finmix }
  fin_calib: { n: 24000, fonts: any, books: heldout, families: [opensans, notosans, firasans, ptsans, ubuntu, roboto, robotocondensed, rubik, montserrat, worksans, exo2, manrope, jost, inter, istokweb, scada, play, arimo, ubuntucondensed, lato, ptserif, merriweather, lora, librebaskerville, crimsontext, bitter, alegreya, literata, notoserif, tinos, cardo, arvo, zillaslab, robotoslab, crimsonpro, ptmono, firamono, inconsolata, sourcecodepro, cousine, anonymouspro, courierprime, cutivemono, notosansmono, spacemono, spectral, domine, cabin, karla, alegreyasans, ptsansnarrow, vollkorn, jetbrainsmono, robotomono, ubuntumono], degrade: [fin_fax, fin_fax_h, fin_scan, fin_scan_h, fin_copy, fin_copy_h, fin_phone, fin_phone_h], mix: *finmix }
