name: ci

# Build, test and NativeAOT smoke on four platforms, plus a pack-and-consume check of the packages on Linux.
#
# The tests that read the bundled models need the weights. They are release assets of the draft or published release of the
# version in Directory.Build.props (see RELEASING.md), fetched once by the "weights" job and checked against the SHA-256 pins
# in the models.json manifests. On a ci-check/** branch a missing release fails the run; on main the run goes on without
# weights (tests that need them then skip) and says so.
on:
  push:
    branches: [main, 'ci-check/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  weights:
    name: weights
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only to list the draft release: drafts are visible to tokens that can write
    outputs:
      have: ${{ steps.fetch.outputs.have }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and verify the weights
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          STRICT: ${{ startsWith(github.ref, 'refs/heads/ci-check/') }}
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)
          set +e
          tools/ci/fetch-weights.sh "v$version" "$RUNNER_TEMP/weights"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ] && [ "$STRICT" != "true" ]; then
            echo "::warning::no release v$version holds the weights; building without them"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fetch.outputs.have == 'true'
        with:
          name: weights
          path: ${{ runner.temp }}/weights/*
          retention-days: 1
          if-no-files-found: error

  build-test-aot:
    name: ${{ matrix.rid }}
    needs: weights
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep build output out of the checkout
        run: echo "ONEOCR_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.weights.outputs.have == 'true'
        with:
          name: weights
          path: ${{ runner.temp }}/weights

      # The build embeds each weight file after hashing it against its pin; a mismatch stops the build.
      - name: Point the build at the weights
        if: needs.weights.outputs.have == 'true'
        run: tools/ci/weights-env.sh "$RUNNER_TEMP/weights" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore OneOcr.slnx

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release OneOcr.slnx

      - name: Test
        run: dotnet test --no-build -c Release --solution OneOcr.slnx

      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Trim and AOT warnings are errors (TreatWarningsAsErrors), so any of them fails this step.
      - name: Publish the NativeAOT smoke app
        run: dotnet publish tests/OneOcr.AotSmoke -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/smoke"

      - name: Run it
        run: |
          exe="$RUNNER_TEMP/smoke/OneOcr.AotSmoke"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe"

  packages:
    name: pack and consume
    needs: weights
    if: needs.weights.outputs.have == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep build output out of the checkout
        run: echo "ONEOCR_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weights
          path: ${{ runner.temp }}/weights
      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Pack the seven packages (nothing is pushed anywhere)
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/ci/pack.sh "$RUNNER_TEMP/packages" "$RUNNER_TEMP/weights"
      - name: Check metadata, contents, weights and symbols of every package
        run: python3 tools/ci/check-packages.py "$RUNNER_TEMP/packages" "$VERSION"
      - name: Use the packages from a fresh program, on the JIT and as a NativeAOT binary
        run: tools/ci/consumer-smoke.sh "$RUNNER_TEMP/packages" "$VERSION" linux-x64

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.7 (checksum pinned)
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
      - name: Lint the workflows
        run: ./actionlint -color
